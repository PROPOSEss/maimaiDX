server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: maidx-insight
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cache:
    type: redis

  # 数据源配置
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/maimai_dx?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms
      timeout: 3000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.maimai.maidx.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 日志配置
logging:
  level:
    com.maimai.maidx: debug
    com.maimai.maidx.repository: debug

# 微信小程序配置
wechat:
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}

# JWT 配置
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:604800000}

# 舞萌成绩API配置
maimai:
  api:
    base-url: https://maimaidx-eng.com/maimaidxng/Record/
    timeout: 10000

maidx:
  cache:
    song-ttl: ${MAIDX_CACHE_SONG_TTL:6h}

# AI成绩助手配置
assistant:
  default-user-id: ${ASSISTANT_DEFAULT_USER_ID:999}
  ai:
    enabled: ${ASSISTANT_AI_ENABLED:false}
    api-key: ${ASSISTANT_AI_API_KEY:}
    base-url: ${ASSISTANT_AI_BASE_URL:https://api.openai.com/v1/chat/completions}
    model: ${ASSISTANT_AI_MODEL:gpt-4o-mini}
    timeout-ms: ${ASSISTANT_AI_TIMEOUT_MS:3000}

# Springdoc / Swagger 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
