# Isolated validation only. Random loopback ports; no development volumes or env file.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: validation-only-password
      MYSQL_DATABASE: maimaidx_validation
      TZ: Asia/Shanghai
    ports: ["127.0.0.1::3306"]
    tmpfs: ["/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -pvalidation-only-password --silent"]
      interval: 2s
      timeout: 5s
      retries: 60
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: ["127.0.0.1::5672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 40
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1::6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
